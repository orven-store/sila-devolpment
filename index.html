<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SILA Developments</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Italiana&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#2b2b2b;--ink:#e9e4da;--mute:#8d887d;--gold:#b89a62;--gold2:#d9c08a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:300 14px/1.7 Jost,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 6vw;flex-wrap:wrap}
.logo{font:400 44px/1 Italiana,serif;letter-spacing:1px;background:linear-gradient(90deg,#a8854d,#e2cb96 50%,#a8854d);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.logo small{display:block;font:300 6px/1 Jost,sans-serif;letter-spacing:5px;margin-top:4px;color:var(--gold)}
nav{display:flex;gap:clamp(16px,3vw,48px);flex-wrap:wrap}
nav a{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#cfc9bd;padding:6px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
nav a:hover,nav a.on{color:var(--gold2);border-color:var(--gold)}
.tools{display:flex;gap:14px}
.pill{font:300 11px Jost,sans-serif;letter-spacing:3px;text-transform:uppercase;border:1px solid #cfc9bd;border-radius:20px;padding:6px 18px;color:var(--ink);background:none;cursor:pointer}
.pill.w{background:#fff;color:#444;border-color:#fff;min-width:90px}
.pill:hover{border-color:var(--gold2);color:var(--gold2)}.pill.w:hover{background:var(--gold2);color:#222}
main{flex:1;display:flex}
.view{display:none;flex:1}.view.on{display:flex}
.hero{position:relative;flex:none;width:100%;aspect-ratio:1338/596;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#16140f}
.bg{position:absolute;inset:0;transition:opacity .8s}
.tag{position:relative;display:flex;align-items:center;gap:36px;flex-wrap:wrap;justify-content:center;padding:0 6vw;text-align:left}
.tag .logo{font-size:clamp(64px,9vw,110px)}
.tag h1{margin:0;font:400 clamp(20px,2.4vw,30px)/1.1 Jost,sans-serif;letter-spacing:2px;color:#fff;position:relative}
.tag h1 em{display:block;font:400 clamp(30px,3.6vw,48px)/.8 "Mrs Saint Delafield",cursive;color:var(--gold2);margin:4px 0 0 36px}
#v-home{flex-direction:column}
.slogan{padding:12vh 6vw;text-align:center;background:var(--bg)}
.slogan h2{font:400 clamp(30px,4.4vw,56px)/1.15 Italiana,serif;letter-spacing:2px;color:var(--gold2);margin:0 auto 18px;max-width:20ch}
.slogan p{margin:0 auto;max-width:56ch;color:var(--mute);font-size:15px}
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:6vw;padding:12vh 6vw;background:#242424;border-top:1px solid #3a3a3a}
.story h2{font:400 clamp(30px,4vw,48px)/1.1 Italiana,serif;letter-spacing:2px;color:var(--gold2);margin:0;padding-top:6px;border-top:1px solid var(--gold);padding-top:22px;align-self:start}
.story p{margin:0 0 18px;color:#bdb7ab;font-size:15px;max-width:62ch}
.story p:last-child{margin:0}
.hp{padding:12vh 6vw;background:var(--bg)}
.hp h2{font:400 clamp(30px,4vw,48px)/1.1 Italiana,serif;letter-spacing:2px;color:var(--gold2);margin:0 0 36px}
.hp .grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.hp .card{padding:0 0 24px;overflow:hidden}
.hp .card h3,.hp .card p{padding:0 24px}
.hp .ph{height:200px;background:linear-gradient(135deg,#17150f,#4a4030);margin-bottom:20px;transition:transform .7s ease}
.hp .card{transition:transform .35s ease,border-color .2s}
.hp .card:hover{transform:translateY(-5px)}
.hp .card:hover .ph{transform:scale(1.08)}
.more{display:block;padding:14px 24px 0;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold2);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.hp .card:hover .more,.hp .card:focus-visible .more{opacity:1;transform:none}
@media(hover:none){.more{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:36px;padding:9vh 6vw;background:var(--bg);border-top:1px solid #3a3a3a;text-align:center}
.stats b{display:block;font:400 clamp(40px,5vw,66px)/1 Italiana,serif;color:var(--gold2);margin-bottom:10px}
.stats span{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mute)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .5s ease,transform .5s ease}
.rv.in{opacity:1;transform:none}
.news{background:#242424;border-top:1px solid #3a3a3a}
.news .card{background:#2b2b2b}
.news time{display:block;padding:0 24px;margin-bottom:8px;font-size:12px;color:var(--gold)}
.partners .logos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px}
.partners .logos div{height:90px;border:1px solid #444;display:grid;place-items:center;color:var(--mute);font-size:12px;letter-spacing:3px;text-transform:uppercase}
.page{flex:1;padding:6vh 6vw;max-width:1100px;margin:0 auto}
.page h2{font:400 clamp(30px,4vw,48px)/1.1 Italiana,serif;color:var(--gold2);margin:0 0 8px;letter-spacing:2px}
.page>p{color:var(--mute);max-width:60ch;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{border:1px solid #444;padding:26px;background:#252525;transition:border-color .2s}
.card:hover{border-color:var(--gold)}
.card h3{font:400 15px Jost,sans-serif;letter-spacing:3px;text-transform:uppercase;margin:0 0 10px;color:var(--ink)}
.card p{margin:0;color:var(--mute)}
form{display:grid;gap:14px;max-width:480px}
input,textarea{background:#252525;border:1px solid #444;color:var(--ink);padding:12px 14px;font:300 14px Jost,sans-serif}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.send{justify-self:start;cursor:pointer}
footer{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:34px 6vw;background:var(--bg)}
.soc{display:flex;gap:22px}
.soc a{width:32px;height:32px;border-radius:50%;background:#f4efe3;color:#2b2b2b;display:grid;place-items:center;transition:background .2s}
.soc a:hover{background:var(--gold2)}
.soc svg{width:16px;height:16px;fill:currentColor}
.fl{display:flex;gap:18px;flex-wrap:wrap;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--mute)}
.fl a:hover{color:var(--gold2)}
@media(max-width:700px){header{justify-content:center}.tag{flex-direction:column;text-align:center}.tag h1 em{margin-left:0}}
.brand img{display:block;height:60px;width:auto}
.tag .hlogo{width:clamp(190px,24vw,320px);height:auto}
.tag .htag{width:clamp(170px,19vw,270px);height:auto}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(to bottom,rgba(43,43,43,0),rgba(43,43,43,.55) 55%,var(--bg));pointer-events:none}
@media(max-width:700px){.hero{aspect-ratio:auto;min-height:60vh}.bg{background-size:cover!important}}
.hp:not(.news):not(.partners){padding:14vh 7vw}
.hp:not(.news):not(.partners) h2{margin-bottom:56px}
.hp:not(.news):not(.partners) h2::after{content:"";display:block;width:56px;height:1px;background:var(--gold);margin-top:18px}
.hp:not(.news):not(.partners) .grid{gap:34px}
.hp:not(.news):not(.partners) .card{padding:0 0 34px}
.hp:not(.news):not(.partners) .card h3,.hp:not(.news):not(.partners) .card p,.hp:not(.news):not(.partners) .more{padding-left:30px;padding-right:30px}
.hp:not(.news):not(.partners) .card h3{margin-bottom:12px}
.hp:not(.news):not(.partners) .ph{height:230px;margin-bottom:26px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.tag .logo{text-align:center}.tag .logo small{text-align:center;padding-left:5px}
.slogan .rt{margin:0;font:400 clamp(28px,4vw,52px)/1.1 Jost,sans-serif;letter-spacing:3px;color:#fff}
.slogan .rt em{display:block;font:400 clamp(48px,7vw,96px)/.8 "Mrs Saint Delafield",cursive;color:var(--gold2);margin-top:10px}
.hp.news{padding:14vh 7vw}
.hp.news h2{margin-bottom:56px}
.hp.news h2::after{content:"";display:block;width:56px;height:1px;background:var(--gold);margin-top:18px}
.hp.news .grid{gap:34px}
.hp.news .card{padding:0 0 34px}
.hp.news .card h3,.hp.news .card p,.hp.news time{padding-left:30px;padding-right:30px}
.hp.news .card h3{margin-bottom:12px}
.hp.news time{margin-bottom:10px}
.hp.news .ph{height:230px;margin-bottom:26px}
@media(max-width:700px){
.view,#v-home{min-width:0;max-width:100%}.hp{min-width:0;max-width:100%;overflow:hidden}
header{padding:14px 5vw 10px;gap:10px;justify-content:center}
.brand img{height:38px}
nav{width:100%;flex-wrap:nowrap;overflow-x:auto;gap:20px;justify-content:flex-start;scrollbar-width:none;padding-bottom:2px}
nav::-webkit-scrollbar{display:none}
nav a{font-size:10px;letter-spacing:2px;white-space:nowrap;flex:none}
.hero{min-height:340px}.hero::after{height:30%}.tag{padding-bottom:40px}
.tag{gap:10px}.tag .logo{font-size:58px}.tag h1{font-size:18px}.tag h1 em{font-size:30px;margin:2px 0 0}
.slogan,.story,.hp,.stats{padding:48px 6vw}
.story{gap:18px}
.slogan h2,.story h2,.hp h2{font-size:28px}
.hp h2{margin-bottom:22px}
.slogan p,.story p{font-size:14px}
.stats{grid-template-columns:1fr 1fr;gap:26px 14px}.stats b{font-size:36px}.stats span{font-size:10px;letter-spacing:2px}
.hp .grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 6vw;gap:14px;margin:0 -6vw;padding:0 6vw 6px;scrollbar-width:none}
.hp .grid::-webkit-scrollbar{display:none}
.hp .card{flex:0 0 76%;scroll-snap-align:start}
.hp .ph{height:130px;margin-bottom:14px}
.hp:not(.news):not(.partners){padding:56px 7vw}
.hp:not(.news):not(.partners) h2{margin-bottom:32px}
.hp:not(.news):not(.partners) .grid{gap:18px;margin:0 -7vw;padding:0 7vw 6px;scroll-padding:0 7vw}
.hp:not(.news):not(.partners) .card{flex-basis:74%;padding:0 0 26px}
.hp:not(.news):not(.partners) .card h3,.hp:not(.news):not(.partners) .card p,.hp:not(.news):not(.partners) .more{padding-left:22px;padding-right:22px}
.hp:not(.news):not(.partners) .ph{height:150px;margin-bottom:20px}
.hp.news{padding:56px 7vw}
.hp.news h2{margin-bottom:32px}
.hp.news .grid{gap:18px;margin:0 -7vw;padding:0 7vw 6px;scroll-padding:0 7vw}
.hp.news .card{flex-basis:74%;padding:0 0 26px}
.hp.news .card h3,.hp.news .card p,.hp.news time{padding-left:22px;padding-right:22px}
.hp.news .ph{height:150px;margin-bottom:20px}
.partners .logos{grid-template-columns:1fr 1fr 1fr;gap:10px}.partners .logos div{height:56px;font-size:9px;letter-spacing:1px}
.page{padding:32px 6vw}.card{padding:18px}
footer{padding:22px 6vw;gap:14px}.fl{gap:10px 14px;font-size:9px;letter-spacing:2px}
}
.card.pc{padding:0 0 24px;overflow:hidden}.pc .ph{height:190px;margin-bottom:18px;background:linear-gradient(135deg,#17150f,#4a4030)}.pc h3,.pc p,.pc time{padding:0 24px}.pc time{display:block;font-size:12px;color:var(--gold);margin-bottom:8px}
</style>
</head>

if(st.storyText)$q(".story > div").innerHTML=st.storyText.split(/\n\s*\n/).map(function(p){return"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>"}).join("");
if(st.stats&&st.stats.length)$q(".stats").innerHTML=st.stats.map(function(x){var sf=x.suffix||"";return'<div><b data-n="'+(+x.value||0)+'" data-f="'+(+x.startFrom||0)+'" data-s="'+esc(sf)+'">'+(+x.value||0)+esc(sf)+'</b><span>'+esc(x.label)+'</span></div>'}).join("")}
if(d.projects&&d.projects.length){
$q(".hp:not(.news):not(.partners) .grid").innerHTML=d.projects.map(function(p){return'<a class="card" href="#projects">'+phd(p.image)+'<h3>'+esc(p.title)+'</h3><p>'+esc(p.description)+'</p><span class="more">View project &rarr;</span></a>'}).join("");
$q("#v-projects .grid").innerHTML=d.projects.map(function(p){return'<div class="card pc">'+phd(p.image)+'<h3>'+esc(p.title)+'</h3><p>'+esc(p.description)+'</p></div>'}).join("")}
if(d.news&&d.news.length){
$q(".news .grid").innerHTML=d.news.slice(0,3).map(function(n){return'<a class="card" href="#media">'+phd(n.image)+'<time>'+fdate(n.date)+'</time><h3>'+esc(n.title)+'</h3><p>'+esc(n.summary)+'</p></a>'}).join("");
$q("#v-media .grid").innerHTML=d.news.map(function(n){return'<div class="card pc">'+phd(n.image)+'<time>'+esc(n.kind)+" - "+fdate(n.date)+'</time><h3>'+esc(n.title)+'</h3><p>'+esc(n.summary)+'</p></div>'}).join("")}
if(d.partners&&d.partners.length)$q(".partners .logos").innerHTML=d.partners.map(function(p){var i=p.logo?'<img src="'+esc(p.logo)+'" alt="'+esc(p.name)+'" style="max-width:70%;max-height:60%;filter:grayscale(1);opacity:.8">':esc(p.name);return p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener" style="display:grid;place-items:center;height:90px;border:1px solid #444;color:var(--mute);font-size:12px;letter-spacing:3px;text-transform:uppercase">'+i+'</a>':'<div>'+i+'</div>'}).join("");
if(window.io)document.querySelectorAll(".stats").forEach(function(e){io.unobserve(e);io.observe(e)})}
function sendForm(e,f){e.preventDefault();var b=f.querySelector(".send");
if(!CMS.formEndpoint){b.textContent="Message sent (demo)";return false}
b.textContent="Sending...";
fetch(CMS.formEndpoint,{method:"POST",headers:{"Accept":"application/json"},body:new FormData(f)}).then(function(r){b.textContent=r.ok?"Message sent":"Error, try again";if(r.ok)f.reset()}).catch(function(){b.textContent="Error, try again"});return false}
loadCMS();
var still=matchMedia("(prefers-reduced-motion: reduce)").matches||!window.IntersectionObserver;
function count(el){var n=+el.dataset.n,f=+(el.dataset.f||0),s=el.dataset.s||"",t0=null,id=el._id=(el._id||0)+1;function st(t){if(el._id!=id)return;if(!t0)t0=t;var k=Math.min((t-t0)/1000,1);k=1-Math.pow(1-k,3);el.textContent=Math.round(f+(n-f)*k)+(k==1?s:"");if(k<1)requestAnimationFrame(st)}requestAnimationFrame(st)}
function reset(el){el._id=(el._id||0)+1;el.textContent=(+(el.dataset.f||0))+""}
var io=still?null:new IntersectionObserver(function(es){es.forEach(function(e){var t=e.target;if(t.classList.contains("stats")){if(e.isIntersecting){t.classList.add("in");t.querySelectorAll("b").forEach(count)}else{t.querySelectorAll("b").forEach(reset)}return}if(!e.isIntersecting)return;t.classList.add("in");io.unobserve(t)})},{threshold:.25});
main.querySelectorAll(".slogan,.story,.stats,.hp").forEach(function(el){if(io){el.classList.add("rv");io.observe(el)}});
</script>
</body>
